# Distances are pixels in the baked font atlas (68px cap height), y points UP.
# Independent passes: changing selection tint affects only the fill.
fill.color=F2EEE2
selected.color=F4BE54
outline.color=15170FFF
outline.radius=2.5
outline.x=0
outline.y=0
shadow.color=090B08A0
shadow.x=3
shadow.y=-4
shadow.radius=1
# Optional directional extrusion; off in the default preset.
extrusion.color=34382AFF
extrusion.x=3
extrusion.y=-4
extrusion.steps=0
